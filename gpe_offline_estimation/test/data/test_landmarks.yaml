# Reference frame_id. Landmark coordinates are relative to this frame.
frame_id: /map

# Landmark information:
# ID: Integer. Will be used as node ID in the graph.
#     ID must be a positive integer with a max value of 2147483647.
# Type: Landmark type. Possible options:
#    * PointXY: [x, y]
#    * PointXYZ: [x, y, z]
#    * Pose2D: [x, y, yaw]
#    * Pose3D: [x, y, z, roll, pitch, yaw]
#    * Pose3DQuat: [x, y, z, qx, qy, qz, qw]
# NOTE: At this moment only PointXY landmarks are supported.
# Coords: Array of coordinates. Length and meaning depend on type.
landmarks:
    - id: 1
      type: PointXY
      coords: [16.3, 16.9]
    - id: 2
      type: PointXY
      coords: [18.3, -3.5]
    - id: 3
      type: PointXY
      coords: [12.4, 2.0]
    - id: 4
      type: PointXY
      coords: [-11.1, 19.9]
    - id: 5
      type: PointXY
      coords: [4.3, 15.9]
    - id: 6
      type: PointXY
      coords: [-1.0, 6.0]
    - id: 7
      type: PointXY
      coords: [-13.4, -15.9]
    - id: 8
      type: PointXY
      coords: [17.1, -16.7]
    - id: 9
      type: PointXY
      coords: [-8.2, 6.3]
    - id: 10
      type: PointXY
      coords: [-10.4, -0.1]

