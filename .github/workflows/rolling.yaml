name: rolling

on:
  pull_request:
    branches:
      - rolling
    paths-ignore:
      - 'README.md'
  push:
    branches:
      - rolling
    paths-ignore:
      - 'README.md'
  schedule:
      - cron: '0 0 * * 1'
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:noble
    steps:
      - name: Setup ROS 2
        uses: ros-tooling/setup-ros@0.7.15
      - name: Build and test
        uses: ros-tooling/action-ros-ci@0.4.5
        with:
          package-name: gpe_core gpe_msgs gpe_landmark_server gpe_offline_estimation
          import-token: ${{ secrets.GITHUB_TOKEN }}
          target-ros2-distro: rolling
          colcon-defaults: |
            {
              "test": {
                "parallel-workers" : 1
              }
            }
          # vcs-repo-file-url: ${GITHUB_WORKSPACE}/dependency_repos.repos
          colcon-mixin-repository: https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml
